name = "opencode"
version = "1.17.15"
abi = "riscv64gc-linux-musl"

# opencode — the open-source AI coding agent (github.com/anomalyco/opencode),
# packaged to run ON the guest `node` (install the `node` recipe too). This ships
# opencode's *Node* bundle (serve-only, TUI-free) — NOT the upstream Bun binary,
# which has no riscv64 build. The bundle + a trimmed node_modules install under
# /usr/local/lib/opencode and a /usr/local/bin/opencode wrapper execs it on node.
#
# Run model: `opencode serve` exposes opencode's HTTP API; a client (the terminal)
# drives it via vm.virtualServer.injectConnection(). The interactive `run`/TUI path
# is Bun/@opentui-coupled and is NOT included. Networking to the model/registry is
# via the guest's /dev/__net__ bridge (the loopback proxy nano-net-proxy.cjs).
#
# STATUS of `serve` in the emulator: WORKING (2026-07-09). `opencode serve`
# reaches listening in ~68s headless and is functional — GET /config → 200 and
# POST /session creates a real sqlite-backed session (verified). `--help` also
# runs+conforms (golden below). All the diagnosed serve blockers are now FIXED:
# file-backed node:sqlite (fcntl advisory-lock + fsync); WAL journalling
# (build.sh rewrites it to DELETE — WAL needs -shm mmap the emulator lacks); the
# mmap OOM (munmap now reclaims); and (2026-07-09) the event-loop busy-spin.
#
# The busy-spin was the real one. Root cause (measured, not the earlier "epoll
# doesn't block" guess): node's event loop runs on TWO idle EPOLL_WAIT threads,
# and the VM scheduler's find_runnable kept context-switching each eventless
# epoll_pwait to the *other* idle epoll thread — an infinite ping-pong (614k
# epoll_pwait + 1.2M clock_gettime in 3s, 100% CPU, host never reached). Fixed by
# gating that path so an eventless wait with no progressable peer yields to the
# host (STATUS_EPOLL_BLOCKED); the host then truly parks (vm_epoll_timeout_ms +
# _parkServer, mirrored into the SDK vendor). VERIFIED headlessly on the real
# container: idle CPU 100%->0% for both a bare node http server AND a setTimeout,
# the timer still fires (no thread starvation), an injected GET is served
# (HTTP/1.1 200 OK), node smoke 5/5, run_tests.sh unchanged.
#
# mDNS/UDP was a RED HERRING (not a blocker): `serve --mdns` defaults to false,
# and even when on the VM accepts SOCK_DGRAM sockets, setsockopt is a success-stub
# (IP_ADD_MEMBERSHIP won't throw), and opencode wraps Bonjour publish in
# try/catch + .on('error'), so the advertise fails silently.
#
# Full `opencode serve` (the 16MB bundle) WAS run end-to-end headless this
# session. Past the busy-spin it hit ONE more real blocker: pwrite64 (68) /
# pwritev (70) were missing from the host FS dispatch (pread64/preadv existed but
# not their write mirrors), so SQLite's positioned DB-file writes returned ENOSYS
# ("[NanoVM] unhandled FS syscall 68") and opencode's Effect-SQL migrations died
# with "SQL logic error" / "cannot rollback". FIXED (nano container + SDK vendor);
# file-backed node:sqlite now round-trips and serve gets past DB init with zero
# SqlError. Then the LAST blocker: after DB init serve stalled 11+min in pure
# compute before binding. Symbolized the hot guest pc (0x64e5xx, no-strip node +
# nm bisect) → **v8::internal::MarkCompactCollector::MarkObjectsFromClientHeaps** —
# it was V8 GARBAGE COLLECTION, not schema-gen. opencode's startup allocates
# heavily → repeated Mark-Compact, and V8's default PARALLEL/CONCURRENT GC spawns
# helper threads that thrash the emulator's thread scheduler (same failure mode as
# the epoll ping-pong). FIX: run node with **--single-threaded-gc** (added to the
# bin wrapper in build.sh) → the 11min wall collapses to ~10s and serve reaches
# listening in ~68s. Heap-size flags (--max-semi-space-size/--max-old-space-size)
# did NOT help — it's GC thread-coordination, not GC frequency.
#
# WARM SNAPSHOT of `serve` WORKS — ~1.9s fresh-VM restore vs ~68s cold (~36x,
# 2026-07-09). This needed the emulator to persist, across restore, host-side
# state that the restore reset zeroes: the socket table (vm_sockets_ptr/size),
# the event-loop statics (vm_evloop_dump/load: epoll interest list, eventfd,
# timerfd — without them the resumed libuv loop watched an empty epoll set and
# hung), and the decoded-block cache (vm_blocks_ptr/size — without it the guest
# re-decodes its code cold, the dominant cost). Host-side restore setup is only
# ~250ms (1.3GB RAM memcpy is trivial); the win is warm blocks + not re-running
# init.
# CAPTURE TIMING MATTERS: snapshot when serve is actually READY (drive it to
# GET /config → 200, i.e. routes registered + the config handler warm), NOT at
# the 'listening' event — a 'listening' snapshot restores in ~14s because
# opencode's route/OpenAPI setup isn't done yet and re-runs on resume. Verified
# single-VM (the real deploy shape) restoring into a FRESH VM. The command path
# is unaffected.
#
# Off-VM build (produces the artifacts build.sh consumes): clone opencode, then
# `bun install` and bundle a serve-only entry (yargs + ServeCommand only, 0
# @opentui refs) via `Bun.build({ target:"node", format:"esm",
# external:["jsonc-parser","@lydell/node-pty"] })` → dist/cli/index-nano.js. Ship a
# flat node_modules beside it: a node-pty shim (eager import must resolve; the
# headless path never calls it) + real jsonc-parser. SQLite = Node built-in
# `node:sqlite` (no native addon). See specs + the integration plan for the full
# reproducible recipe.

# Build-time only (never reach the runtime manifest): the packager walks out/ as a
# guest-FS tree and conformance stages `node` + --tree out/.
multifile = true
runner = "node"

[entrypoint]
argv = ["opencode"]
path = "/usr/local/bin/opencode"
env = { }

# App recipe — the only app-provisioning data carried into the signed manifest and
# seen by the SDK runner (provision()). Inline tables must be single-line; the
# catalog's minimal TOML reader (tools/lib/toml.mjs) has no dotted sub-tables or
# multiline strings.
[recipe]
# opencode shells out to these: ripgrep (grep tool), fd (glob/file finder), and
# git (status/diff/log + `check-ignore --stdin` for gitignore-aware file listing
# during context build — required before the first chat turn completes). A shell
# and coreutils (grep/find/ls) come from the bundled busybox.
deps = ["ripgrep", "fd", "git"]
# node hits a benign libuv thread-join assertion on shutdown AFTER correct output;
# the exit code is noise and the trailing native-stack trace is filtered.
benignExitCodes = [134]
outputFilters = ["WorkerThreadsTaskRunner", "Native stack trace", "Assertion failed: \\(0\\)"]

# Warm-snapshot launcher for `serve`: boot node on the serve bundle with
# --single-threaded-gc (required — see the GC note above) + the loopback net
# proxy, and capture the snapshot the moment the server answers GET /config with
# 200 (routes + handler + block cache warm). The `ready` probe makes the runner
# use snapshotAppReady (host-driven) instead of a guest /dev/__snapshot__ sentinel
# — a guest can't loopback to its own listener. A fresh-VM restore of this
# snapshot reaches a serviceable server in ~0.4-2s vs ~68s cold.
warmup = { elfPath = "/usr/bin/node", argv = ["node", "--single-threaded-gc", "--conditions=node", "--require", "/usr/local/lib/opencode/nano-net-proxy.cjs", "/usr/local/lib/opencode/index-nano.js", "serve", "--port", "4096", "--hostname", "127.0.0.1"], env = { UV_THREADPOOL_SIZE = "0", HOME = "/root", NANO_NET_TARGET = "http://nanoinfer.internal" }, maxSteps = 80000000000, ready = { port = 4096, path = "/config", status = 200 } }

# NOTE (warmup / snapshot): cold-loading node + opencode's module graph is
# ~6.7e9 guest instructions (~26 s headless; slower live), so a warm V8 snapshot
# is the intended optimization. The MECHANISM is VERIFIED (2026-07-08): a launcher
# that loads the graph (runs `--help` under a stubbed process.exit) then writes
# /dev/__snapshot__ produces a 1.25 GB warm image; restoreAndRun injects
# /dev/__run__ and executes it in ~2.4 s — an 11× wall-clock win, correct output,
# benign exit 134 on teardown (WorkerThreadsTaskRunner assertion AFTER output).
#   warmup ≈ { elfPath = "/usr/bin/node", launcherPath = "/oc-warm.js", launcher = "const fs=require('fs');globalThis.require=require;const x=process.exit.bind(process);process.exit=()=>{};process.argv=['node','/usr/local/lib/opencode/index-nano.js','--help'];import('/usr/local/lib/opencode/index-nano.js').catch(()=>{}).finally(()=>{process.exit=x;fs.writeFileSync('/dev/__snapshot__','snap');const s=fs.readFileSync('/dev/__run__','utf8');(new Function(s))();});", argv = ["node", "--conditions=node", "/oc-warm.js"], env = { UV_THREADPOOL_SIZE = "0", HOME = "/root", NODE_COMPILE_CACHE = "/root/.oc-ccache" }, maxSteps = 60000000000 }
#
# NOT YET WIRED for `serve` (the open follow-up): index-nano.js runs the yargs CLI
# at TOP LEVEL on import (`…parse()`). After the warmup import runs `--help`, the
# ESM module is cached and already-executed, so a /dev/__run__ payload that
# re-imports it is a no-op — it cannot then launch `serve`. Two clean fixes:
#   (a) rebuild the bundle off-VM with a callable entry (`export function main(argv)`
#       + `if (import.meta.main) main(process.argv)`), so warmup imports to warm the
#       graph WITHOUT running, and the run payload calls `main(['serve', …])`; or
#   (b) snapshot a LIVE listening server (warmup runs `serve`, writes the snapshot
#       once it's listening) and have restore RESUME the event loop — needs a
#       resume-style restore, not the inject-fresh-payload path.
# Until then the opencode adapter (terminal) cold-starts serve via writeStdin —
# correct, just slow on first launch; the snapshot is a pure speedup on top.

[maintainer]
name = "userland.run"
contact = "https://github.com/userland-run/catalog"

[status]
features = ["catalog.recipe.opencode"]
